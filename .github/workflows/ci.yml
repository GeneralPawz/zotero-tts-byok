name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests
        run: |
          node test/run-tests.js
          node test/check-l10n.js
          node test/check-highlight.js
          node test/check-pane.js

      # Also proves the package is well formed: build.ps1 fails on a backslash in a
      # ZIP entry name or a missing root manifest.json, both of which make Zotero
      # refuse the install with a generic "may be incompatible" message.
      - name: Build
        shell: pwsh
        run: ./build.ps1
